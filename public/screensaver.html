<!DOCTYPE html>\n<html lang=\"sv\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Skärmsläckare - Blåsutgatan</title>\n    <link rel=\"stylesheet\" href=\"/screensaver.css\" />\n  </head>\n  <body>\n    <div class=\"screensaver-container\">\n      <div class=\"screensaver-content\">\n        <div class=\"stop-name-screensaver\">Blåsutgatan</div>\n        \n        <div class=\"departure-display\">\n          <div class=\"line-number\" id=\"lineNumber\">--</div>\n          <div class=\"time-info\">\n            <div class=\"departure-time\" id=\"departureTime\">--:--</div>\n            <div class=\"minutes-until\" id=\"minutesUntil\">-</div>\n          </div>\n        </div>\n        \n        <div class=\"current-time\" id=\"currentTime\">--:--</div>\n        \n        <div class=\"status-indicator\" id=\"statusIndicator\">Uppdaterar...</div>\n      </div>\n    </div>\n\n    <script src=\"/screensaver.js\"></script>\n  </body>\n</html>\n
